<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>SOMNIOVOX 設定シート</title>
</head>
<body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7ee0b8;text-decoration:none}a:hover{color:#a8ecd0}
</style>

<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: radial-gradient(120% 70% at 50% 45%, #3a3e45 0%, #24272c 55%, #17191c 100%); color: #f2f3f5; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px">

  <!-- キャラクター（腰から上。透過画像を背景全面に敷く） -->
  <img src="../../public/characters/nurse_robo.webp" alt="" aria-hidden="true" style="position: absolute; left: -19px; top: 116px; width: 431px; height: 742px; max-width: none; pointer-events: none; user-select: none">
  <!-- 背面のホーム（暗転） -->
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 56px; padding: 0 20px; display: flex; align-items: center; opacity: 0.35">
    <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.22em; color: #d7dadf">SOMNIOVOX</span>
  </div>
  <a href="home-shuffle.html" aria-label="閉じる" style="position: absolute; inset: 0; background: rgba(10,11,13,0.55)"></a>

  <!-- シート -->
  <div style="position: absolute; left: 0; right: 0; top: 96px; bottom: 0; box-sizing: border-box; background: #24272c; border-top: 1px solid rgba(126,224,184,0.22); border-radius: 28px 28px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,0.45); display: flex; flex-direction: column">

    <!-- ハンドル：この帯全体がドラッグ領域 -->
    <div style="height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
      <div style="width: 36px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.3)"></div>
    </div>

    <div style="flex: 1; padding: 4px 24px 32px; display: flex; flex-direction: column; gap: 28px; overflow: hidden">

      <!-- 声 -->
      <section style="display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.2em; color: #a9aeb6">声</h2>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <button type="button" style="min-height: 48px; padding: 7px 10px; text-align: left; word-break: keep-all; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.10); color: #f2f3f5; font: inherit; cursor: pointer"><span style="display: block; font-size: 12px; line-height: 1.2">九州そら</span><span style="display: block; font-size: 10px; color: #a9aeb6; margin-top: 2px">ささやき</span></button>
          <button type="button" style="min-height: 48px; padding: 7px 10px; text-align: left; word-break: keep-all; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.10); color: #f2f3f5; font: inherit; cursor: pointer"><span style="display: block; font-size: 12px; line-height: 1.2">ずんだもん</span><span style="display: block; font-size: 10px; color: #a9aeb6; margin-top: 2px">ささやき</span></button>
          <button type="button" style="min-height: 48px; padding: 7px 10px; text-align: left; word-break: keep-all; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.10); color: #f2f3f5; font: inherit; cursor: pointer"><span style="display: block; font-size: 12px; line-height: 1.2">No.7</span><span style="display: block; font-size: 10px; color: #a9aeb6; margin-top: 2px">読み聞かせ</span></button>
          <button type="button" style="min-height: 48px; padding: 7px 10px; text-align: left; word-break: keep-all; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.10); color: #f2f3f5; font: inherit; cursor: pointer"><span style="display: block; font-size: 12px; line-height: 1.2">四国めたん</span><span style="display: block; font-size: 10px; color: #a9aeb6; margin-top: 2px">ささやき</span></button>
          <button type="button" style="min-height: 48px; padding: 7px 10px; text-align: left; word-break: keep-all; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.10); color: #f2f3f5; font: inherit; cursor: pointer"><span style="display: block; font-size: 12px; line-height: 1.2">櫻歌ミコ</span><span style="display: block; font-size: 10px; color: #a9aeb6; margin-top: 2px">ロリ</span></button>
          <button type="button" aria-pressed="true" style="min-height: 48px; padding: 7px 10px; text-align: left; word-break: keep-all; border-radius: 12px; border: 1px solid rgba(126,224,184,0.75); background: rgba(126,224,184,0.22); color: #7ee0b8; font: inherit; cursor: pointer"><span style="display: block; font-size: 12px; line-height: 1.25">ナースロボ＿<wbr>タイプＴ</span><span style="display: block; font-size: 10px; color: #7ee0b8; opacity: 0.8; margin-top: 2px">内緒話</span></button>
          <button type="button" style="min-height: 48px; padding: 7px 10px; text-align: left; word-break: keep-all; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.10); color: #f2f3f5; font: inherit; cursor: pointer"><span style="display: block; font-size: 12px; line-height: 1.2">ユーレイちゃん</span><span style="display: block; font-size: 10px; color: #a9aeb6; margin-top: 2px">ささやき</span></button>
          <button type="button" style="min-height: 48px; padding: 7px 10px; text-align: left; word-break: keep-all; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.10); color: #f2f3f5; font: inherit; cursor: pointer"><span style="display: block; font-size: 12px; line-height: 1.2">あんこもん</span><span style="display: block; font-size: 10px; color: #a9aeb6; margin-top: 2px">ささやき</span></button>
          <button type="button" style="min-height: 48px; padding: 7px 10px; text-align: left; word-break: keep-all; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.10); color: #f2f3f5; font: inherit; cursor: pointer"><span style="display: block; font-size: 12px; line-height: 1.2">暁記ミタマ</span><span style="display: block; font-size: 10px; color: #a9aeb6; margin-top: 2px">ささやき</span></button>
        </div>
      </section>

      <!-- 距離感 -->
      <section style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <h2 style="margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.2em; color: #a9aeb6">声の距離</h2>
        </div>
        <div role="group" aria-label="声の距離" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <button type="button" aria-pressed="true" style="height: 68px; border-radius: 14px; border: 1px solid rgba(126,224,184,0.75); background: rgba(126,224,184,0.22); color: #7ee0b8; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
            <svg aria-hidden="true" width="34" height="18" viewBox="0 0 34 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 15V7a5 5 0 0 1 10 0c0 3-3 4-3 7"></path><circle cx="24" cy="9" r="2.4" fill="currentColor" stroke="none"></circle></svg>
            <span style="font-size: 12px">耳元</span>
          </button>
          <button type="button" style="height: 68px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.10); color: #d7dadf; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
            <svg aria-hidden="true" width="34" height="18" viewBox="0 0 34 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 15V7a5 5 0 0 1 10 0c0 3-3 4-3 7"></path><path d="M20 5.5a5 5 0 0 1 0 7"></path><circle cx="28" cy="9" r="2.4" fill="currentColor" stroke="none"></circle></svg>
            <span style="font-size: 12px">そば</span>
          </button>
          <button type="button" style="height: 68px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.10); color: #d7dadf; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
            <svg aria-hidden="true" width="34" height="18" viewBox="0 0 34 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 15V7a5 5 0 0 1 10 0c0 3-3 4-3 7"></path><path d="M17 5.5a5 5 0 0 1 0 7M21 3a8 8 0 0 1 0 12"></path><circle cx="30" cy="9" r="2.4" fill="currentColor" stroke="none"></circle></svg>
            <span style="font-size: 12px">すこし離れて</span>
          </button>
        </div>
      </section>

      <!-- 環境音 -->
      <section style="display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.2em; color: #a9aeb6">環境音</h2>
        <div role="group" aria-label="環境音" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <!-- 雨（ON・音量 60%） -->
          <button type="button" aria-pressed="true" style="position: relative; overflow: hidden; height: 64px; border-radius: 14px; border: 1px solid rgba(126,224,184,0.75); background: rgba(126,224,184,0.22); color: #7ee0b8; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 0 1-.6-7.95A6 6 0 0 1 18 8.5a3.5 3.5 0 0 1 .5 6.5"></path><path d="M9 18l-1 2.5M13 17l-1 2.5M17 18l-1 2.5"></path></svg>
            <span style="font-size: 11px">雨</span>
            <span aria-hidden="true" style="position: absolute; left: 0; bottom: 0; height: 2px; width: 60%; background: #7ee0b8"></span>
          </button>
          <!-- 焚き火（ON・音量 30%） -->
          <button type="button" aria-pressed="true" style="position: relative; overflow: hidden; height: 64px; border-radius: 14px; border: 1px solid rgba(126,224,184,0.75); background: rgba(126,224,184,0.22); color: #7ee0b8; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-3.6 0-6-2.4-6-5.6 0-2.8 1.8-4.6 3.4-6.4.3 1.6 1.1 2.6 2.1 3 .2-2.8 1.3-5.8 3.6-8 .3 2.6 1.3 4.2 2.6 5.8 1 1.3 2.3 2.8 2.3 5.6 0 3.2-2.4 5.6-8 5.6z"></path><path d="M12 21c-1.6 0-2.7-1.1-2.7-2.6 0-1.3.9-2.1 1.5-3 .5.8 1 1.1 1.5 1.3.1-1.1.5-2.1 1.2-3 .4 1.2 1.1 1.9 1.4 3 .4 1.6-.6 4.3-2.9 4.3z"></path></svg>
            <span style="font-size: 11px">焚き火</span>
            <span aria-hidden="true" style="position: absolute; left: 0; bottom: 0; height: 2px; width: 30%; background: #7ee0b8"></span>
          </button>
          <!-- 川 -->
          <button type="button" style="height: 64px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.10); color: #d7dadf; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8c2 0 2.5-1.5 4.5-1.5S10 8 12 8s2.5-1.5 4.5-1.5S19 8 21 8"></path><path d="M3 13c2 0 2.5-1.5 4.5-1.5S10 13 12 13s2.5-1.5 4.5-1.5S19 13 21 13"></path><path d="M3 18c2 0 2.5-1.5 4.5-1.5S10 18 12 18s2.5-1.5 4.5-1.5S19 18 21 18"></path></svg>
            <span style="font-size: 11px">川</span>
          </button>
          <!-- ピンクノイズ -->
          <button type="button" style="height: 64px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.10); color: #d7dadf; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h2l2-6 3 12 3-9 2 5 2-3 1 1h3"></path></svg>
            <span style="font-size: 11px">ピンク</span>
          </button>
          <!-- ブラウンノイズ -->
          <button type="button" style="height: 64px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.10); color: #d7dadf; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13c2-5 4-5 6-2s4 4 6 0 4-4 6 1"></path></svg>
            <span style="font-size: 11px">ブラウン</span>
          </button>
          <!-- バイノーラル -->
          <button type="button" style="height: 64px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.10); color: #d7dadf; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"></path><rect x="3" y="13" width="4.5" height="6" rx="1.6"></rect><rect x="16.5" y="13" width="4.5" height="6" rx="1.6"></rect></svg>
            <span style="font-size: 11px">バイノーラル</span>
          </button>
        </div>

        <!-- 鳴っている音の調整：細いスライダーだけ -->
        <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 4px">
          <div style="display: flex; align-items: center; gap: 12px">
            <label for="vol-rain" style="width: 56px; font-size: 12px; color: #d7dadf; flex-shrink: 0">雨</label>
            <input id="vol-rain" type="range" min="0" max="100" value="60" aria-label="雨の音量" style="flex: 1; height: 2px; accent-color: #7ee0b8; margin: 0">
            <div role="group" aria-label="雨の強さ" style="display: flex; gap: 4px; flex-shrink: 0">
              <button type="button" style="height: 28px; padding: 0 9px; border-radius: 8px; border: 0; background: rgba(255,255,255,0.10); color: #a9aeb6; font: inherit; font-size: 11px; cursor: pointer">静か</button>
              <button type="button" aria-pressed="true" style="height: 28px; padding: 0 9px; border-radius: 8px; border: 0; background: rgba(126,224,184,0.28); color: #7ee0b8; font: inherit; font-size: 11px; cursor: pointer">普通</button>
              <button type="button" style="height: 28px; padding: 0 9px; border-radius: 8px; border: 0; background: rgba(255,255,255,0.10); color: #a9aeb6; font: inherit; font-size: 11px; cursor: pointer">強い</button>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 12px">
            <label for="vol-fire" style="width: 56px; font-size: 12px; color: #d7dadf; flex-shrink: 0">焚き火</label>
            <input id="vol-fire" type="range" min="0" max="100" value="30" aria-label="焚き火の音量" style="flex: 1; height: 2px; accent-color: #7ee0b8; margin: 0">
          </div>
        </div>
      </section>

    </div>
  </div>

</div>
</body>
</html>
